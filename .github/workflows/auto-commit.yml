name: Random Daily Auto Commit

on:
  schedule:
    - cron: "0 6 * * *"  # Runs every day at 6 AM UTC
  workflow_dispatch:    # Lets you trigger manually

jobs:
  autocommit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Make random commit
        run: |
          echo "from random import randint
import os
from datetime import datetime
now = datetime.now()
if randint(0, 2):  # ~66% chance to commit
    with open('log.txt', 'a') as f:
        f.write(f'Committed at {now}\\n')
    os.system('git config user.name \"github-actions\"')
    os.system('git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"')
    os.system('git add .')
    os.system(f'git commit -m \"🤖 Random commit at {now}\"')
    os.system('git push')" > commit_daily.py
          python commit_daily.py
